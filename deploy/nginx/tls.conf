# Прод с HTTPS: TLS заканчивается на nginx фронтенда. Подключается через docker-compose.tls.yml, когда на сервере
# лежат certs/fullchain.pem и certs/privkey.pem (в контейнере /etc/nginx/certs). Подробности — docs/DOMAIN_TLS.md.

# http -> https
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/app.inc;
}

# только для проверок на самом сервере (опубликован на 127.0.0.1): deploy.sh ходит сюда за /api/health
server {
    listen 8080;
    server_name localhost;

    include /etc/nginx/app.inc;
}
