# ─────────────────────────────────────────────────────────────────────────────
#  Маппинг Insight → HMS Rent для jira.marvin-it.com (схема «IT Assets», id=1)
#  Правите файл → docker compose restart backend worker
#  Проверка без записи в базу:  python -m app.cli insight-check
# ─────────────────────────────────────────────────────────────────────────────

object_schema_id: 1

# Какие объекты портал знает (всё это видят админы в «Инвентаризации»).
# Что из этого видят сотрудники, решают ПУЛЫ в админке.
# Guest Emulator — это эмуляторы на хост-машинах, а не компьютеры, поэтому исключены.
# НЕ фильтруйте по Status: занятый ПК «выпадет» из выборки и уйдёт в архив.
query: 'objectType = "Automat" AND Type IN ("Physical", "Host Emulator")'

virtual_object_types: []

# Номера ВМ: при заказе ВМ портал берёт свободный объект Insight по этому запросу, имя ВМ = имя объекта (A1###).
# Нужны объекты-заглушки типа Virtual со статусом «На складе»; кончились — заказ ВМ отклоняется.
vm_free_query: 'objectType = "Automat" AND "Status" IN ("На складе") AND "Type" IN ("Virtual")'

attributes:
  name: "Name"
  cpu: "Процессор"
  ram: "RAM"            # «16» — гигабайты
  storage: "Диск"       # «224» — гигабайты; тип (SSD/NVMe) подтягивается из Comment, если он там есть
  gpu: "Видеокарта"
  os: "OS"
  ip_address: "IP Address"
  status: "Status"
  gateway: "Gateway"
  # location: "Data Center"

  # --- Поля аренды: портал читает их из Insight при синхронизации и пишет обратно (INSIGHT_WRITEBACK=true) ---
  # Имена должны совпадать с именами атрибутов типа «Automat» буква в букву (проверка: python -m app.cli insight-check).
  pool: "Пул выдачи"                 # пул, в котором лежит ПК (если такого пула на портале нет — создастся скрытым)
  team: "Команда-получатель"         # отдел, на который оформлен ПК (ищется среди «Отделов» портала по имени)
  usage_period: "Срок использования" # дата «до какого числа» — лучше атрибут типа Date (понимаем и ГГГГ-ММ-ДД, и ДД.ММ.ГГГГ)
  order_number: "Номер заказа"       # сквозной номер выдачи: 1, 2, 3 … (общий для компьютеров и виртуалок)

# Запасной источник: если отдельные атрибуты пустые, характеристики берутся из Comment
# вида «Ryzen 7 2700 | 16GB | GTX 1650 | SSD 224GB /»
specs_attribute: "Comment"

# Статус Insight → статус портала
#   available   — можно бронировать (если ПК в опубликованном пуле)
#   in_use      — занят (фермой, проектом)
#   maintenance — недоступен временно (ТО, тест, склад, доставка…)
#   retired     — выбывает или выбыл
status_map:
  "Ожидает": available
  "Используется": in_use
  "В работе": in_use
  "Исследования": in_use
  "Проекты": in_use
  "проект Events": in_use
  "Эко": in_use
  "ТО": maintenance
  "Тест": maintenance
  "Резерв": maintenance
  "На складе": maintenance      # со склада не выдаём
  "Доставка": maintenance
  "На регистрации": maintenance
  "Frozen": maintenance
  "К закрытию": retired
  "Закрывается": retired
  "Закрыто": retired
  "Списано": retired
  "Неизвестно": unknown

default_status: unknown

# Обратная запись в Insight (включается INSIGHT_WRITEBACK=true в .env).
# Портал меняет ТОЛЬКО атрибут Status: бронь → «Используется», возврат → «Ожидает».
# Exploitation Status и прочие атрибуты не трогаем и в расчёт не берём.
writeback:
  status_attribute: "Status"
  status_values:
    booked: "Используется"
    available: "Ожидает"
    maintenance: "ТО"  # ПК отмечен неисправным (исполнитель → «Сервер неисправен»)
    reserve: "Резерв"  # свободный ПК в пуле, который не является общим (INSIGHT_DEFAULT_POOL): свободен для команд пула
  # Объект ВМ: при заказе → «Используется», после удаления или ошибки → «На складе» (значения по умолчанию такие же):
  # vm_status_values:
  #   taken: "Используется"
  #   free: "На складе"
  # «Пул выдачи», «Команда-получатель», «Срок использования» и «Номер заказа» пишутся в те же атрибуты,
  # из которых читаем (блок attributes выше). При возврате ПК команда, срок и номер заказа очищаются.
  # Нужны другие имена для записи — раскомментируйте:
  # pool_attribute: "..."
  # department_attribute: "..."
  # period_attribute: "..."
  # order_attribute: "..."
