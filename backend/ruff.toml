target-version = "py312"
line-length = 120  # как в остальном коде; влияет только на сортировку импортов (ruff format не используется)

[lint]
select = ["F", "E4", "E7", "E9", "I", "B"]
# B008: FastAPI Depends(...) в значениях аргументов — штатный приём фреймворка
ignore = ["B008"]

[lint.per-file-ignores]
# применённые миграции не редактируются (AGENTS.md), в том числе порядок импортов
"alembic/versions/*" = ["I001"]

[lint.isort]
known-first-party = ["app"]
# папка alembic/ в backend/ иначе принимается за собственный модуль, а не за библиотеку
known-third-party = ["alembic"]
split-on-trailing-comma = false  # уже оформленные в несколько строк импорты не разворачиваются по одному имени
