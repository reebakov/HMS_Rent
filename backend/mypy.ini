[mypy]
python_version = 3.12
files = app
# сторонние пакеты без типов (pyVmomi и др.) не проверяем
ignore_missing_imports = True

# Baseline: модули, где mypy нашёл ошибки на момент подключения (27.10.2026). Новые модули проверяются целиком;
# модуль исправляют и убирают из списка. Основные причины: nullable-связи ORM (ServiceRequest.booking/.computer)
# и передача ORM-объектов в pydantic-схемы.

[mypy-app.cli]
ignore_errors = True

[mypy-app.core.admins]
ignore_errors = True

