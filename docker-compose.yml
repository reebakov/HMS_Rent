# Разработка и демо: образы собираются из исходников, код backend монтируется в контейнер.
# Общая часть сервисов — docker-compose.base.yml.
services:
  db:
    extends:
      file: docker-compose.base.yml
      service: db

  backend:
    extends:
      file: docker-compose.base.yml
      service: backend
    build: ./backend
    volumes:
      - ./backend/app:/app/app:ro

  worker:
    extends:
      file: docker-compose.base.yml
      service: worker
    build: ./backend
    volumes:
      - ./backend/app:/app/app:ro

  frontend:
    extends:
      file: docker-compose.base.yml
      service: frontend
    build: ./frontend

volumes:
  pgdata:
