name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}  # сборку образов из main не прерываем новым пушем

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hmsrent_test
          POSTGRES_USER: hmsrent
          POSTGRES_PASSWORD: hmsrent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hmsrent -d hmsrent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://hmsrent:hmsrent@localhost:5432/hmsrent_test
      ENVIRONMENT: dev
      SECRET_KEY: test-secret-key-for-pytest-only-32b
      INSIGHT_MODE: mock
      INSIGHT_WRITEBACK: "false"
      MATTERMOST_WEBHOOK_URL: ""
      VCENTER_HOST: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt
      - name: Тесты
        run: python -m pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Установка зависимостей
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Тесты
        run: npm run test:coverage
      - name: Сборка
        run: npm run build

  images:
    name: Образы (${{ matrix.name }})
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Теги и метки
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hms-rent-${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest
      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.name }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
