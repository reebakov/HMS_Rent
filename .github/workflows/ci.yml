name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}  # сборку образов из main не прерываем новым пушем

permissions:
  contents: read

jobs:
  # Тесты нужны, только если менялся код, на который они опираются. Правка документации, скриптов выкатки и compose-файлов
  # их не затрагивает. Образы при этом собираются всегда (из кэша, ~25 с): deploy.sh ждёт образ с тегом-sha у каждого коммита.
  changes:
    name: Что изменилось
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Менялся ли код
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          code=true   # по умолчанию тесты запускаются: неизвестная база (первый push, force push) тоже даёт полный прогон
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BASE" "$HEAD")"
            if ! grep -qE '^(backend/|frontend/|\.github/|docker-compose\.test\.yml$)' <<<"$files"; then code=false; fi
            echo "Изменённые файлы:"; echo "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Тесты нужны: $code"

  # Лёгкая проверка конфигов (~20 с). Запускается всегда и не зависит от job «changes»: именно правки документации,
  # скриптов выкатки и compose-файлов тесты пропускают, а ошибка в deploy.sh, compose или nginx ломает только выкатку
  # и без этой проверки всплыла бы на сервере. Входит в needs job «Образы»: красные конфиги блокируют публикацию.
  # Это не меняет логику пропуска тестов: job никогда не пропускается, поэтому !failure() у «Образов» остаётся верным.
  config:
    name: Конфигурация (deploy.sh, compose, nginx)
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v4
      - name: Синтаксис и shellcheck deploy.sh
        run: |
          bash -n scripts/deploy.sh
          shellcheck scripts/deploy.sh   # shellcheck есть на ubuntu-latest
      - name: Все настройки Settings описаны в .env.example
        run: python3 scripts/check_env_example.py
      - name: docker compose config (разработка, прод, прод с HTTPS)
        run: |
          cp .env.example .env   # env_file: .env обязателен; заодно проверяется, что пример разбирается
          docker compose config -q
          docker compose -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml config -q
          docker compose -f docker-compose.test.yml config -q
      # образ nginx тот же, что в frontend/Dockerfile; backend подменяется адресом-заглушкой, иначе nginx -t не найдёт upstream
      - name: nginx -t (http)
        run: |
          docker run --rm --add-host backend:127.0.0.1 \
            -v "$PWD/frontend/nginx/http.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/frontend/nginx/app.inc:/etc/nginx/app.inc:ro" \
            nginx:1.27-alpine nginx -t
      - name: nginx -t (https)
        run: |
          certs="$(mktemp -d)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=ci" \
            -keyout "$certs/privkey.pem" -out "$certs/fullchain.pem"
          docker run --rm --add-host backend:127.0.0.1 \
            -v "$PWD/deploy/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/frontend/nginx/app.inc:/etc/nginx/app.inc:ro" \
            -v "$certs:/etc/nginx/certs:ro" \
            nginx:1.27-alpine nginx -t

  backend:
    name: Backend (pytest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hmsrent_test
          POSTGRES_USER: hmsrent
          POSTGRES_PASSWORD: hmsrent
        ports:
          - 5432:5432
        # БД в памяти, как в docker-compose.test.yml: тесты чистят таблицы перед каждым тестом, диск и fsync тут только тормозят
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U hmsrent -d hmsrent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://hmsrent:hmsrent@localhost:5432/hmsrent_test
      ENVIRONMENT: dev
      SECRET_KEY: test-secret-key-for-pytest-only-32b
      INSIGHT_MODE: mock
      INSIGHT_WRITEBACK: "false"
      MATTERMOST_WEBHOOK_URL: ""
      VCENTER_HOST: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt
      - name: Ruff (статический анализ)
        run: ruff check .
      - name: Mypy (типы backend; модули baseline перечислены в mypy.ini)
        run: mypy
      - name: Тесты (покрытие не ниже fail_under из .coveragerc)
        run: python -m pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Установка зависимостей
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Тесты
        run: npm run test:coverage
      - name: Сборка
        run: npm run build

  images:
    name: Образы (${{ matrix.name }})
    needs: [changes, backend, frontend, config]
    # !failure() вместо неявного success(): образы строятся и тогда, когда тесты пропущены (код не менялся)
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Теги и метки
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hms-rent-${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest
      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.name }}
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
